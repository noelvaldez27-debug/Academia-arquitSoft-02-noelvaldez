# docker-compose.yml — EVALUA-NET
# Levanta el backend y los tres servicios de infraestructura.
# Referencia: RC04, RC05, RC06, RC07, ADR-003, ADR-004, ADR-013.
#
# Versiones fijadas (decisión técnica no recogida en docs/, anotada en PROGRESO.md):
#   PostgreSQL 16, Redis 7, RabbitMQ 3.13-management.
#
# Uso:
#   cp .env.example .env   # (tarea 5)
#   docker compose up --build

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-evalua_net}
      POSTGRES_USER:     ${POSTGRES_USER:-evalua_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalua_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evalua_user} -d ${POSTGRES_DB:-evalua_net}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_pass}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_pass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # consola web de administración (solo desarrollo)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT:     ${PORT:-3000}

      # PostgreSQL — el backend se conecta por nombre de servicio, no por localhost
      DB_HOST:     postgres
      DB_PORT:     ${DB_PORT:-5432}
      DB_NAME:     ${POSTGRES_DB:-evalua_net}
      DB_USER:     ${POSTGRES_USER:-evalua_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-evalua_pass}

      # Redis
      REDIS_HOST:     redis
      REDIS_PORT:     ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}

      # RabbitMQ
      RABBITMQ_HOST:     rabbitmq
      RABBITMQ_PORT:     ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER:     ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_pass}
      RABBITMQ_VHOST:    ${RABBITMQ_VHOST:-/}

      # Clave JWT (AC04: nunca en texto plano en logs)
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_produccion}

      # Almacenamiento de archivos (separatas — ADR-012)
      ALMACEN_LOCAL_PATH: /app/uploads
    volumes:
      - almacen_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  almacen_data:
